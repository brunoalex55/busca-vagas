; ---------------------------------------------------------------------------
; CONFIGURACAO DAS AUTOMACOES RPA (SERVICO DO CHROME)
; ---------------------------------------------------------------------------
;
; Este arquivo e COMPARTILHADO por todos os bots (Divulga Vagas, Gupy,
; LinkedIn e os que vierem): o Chrome headless e um servico unico, e
; todos os bots se conectam nele pela porta CDP.
;
; Cada bot tem o seu proprio config.ini na pasta do provedor, com o que
; e especifico dele (tempo limite, seletores, numero de vagas).
;
; [chrome]
;   endereco_cdp .............. onde o servico do Chrome escuta (CDP)
;   porta_cdp ................ porta do CDP
;   pasta_sessoes ............ pasta do perfil persistente do Chrome
;   canal .................... "chrome" usa o Chrome instalado no sistema;
;                             vazio usa o Chromium que veio com o Playwright
;   headless ................ "1" roda sem janela (servidor), "0" com janela
;   largura / altura ......... tamanho da janela do navegador
;   caminho_chrome ........... caminho do executavel (vazio = descoberta)
;
; OBSERVACAO SOBRE O CLOUDFLARE: alguns sites (como o Divulga Vagas)
; desafiam o navegador headless. O perfil persistente guarda o cookie que
; libera o acesso, entao a primeira navegacao pode ser mais lenta. Com
; headless = "0" (janela visivel) o desafio e resolvido na hora, e o
; perfil ja fica pronto para as chamadas seguintes.
; ---------------------------------------------------------------------------

[chrome]
endereco_cdp = http://127.0.0.1:9222
porta_cdp = 9222
pasta_sessoes = sessions/default
canal = chrome
headless = 1
largura = 1440
altura = 900
caminho_chrome =

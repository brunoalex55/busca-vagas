; ---------------------------------------------------------------------------
; CONFIGURACAO DO BOT DO DIVULGA VAGAS
; ---------------------------------------------------------------------------
;
; O que e especifico deste provedor. O que e do servico do Chrome
; (endereco do CDP, porta, perfil, canal) fica no config.ini da pasta
; acima (automacoes-rpa/config.ini), compartilhado com os outros bots.
;
; [bot]
;   timeout_busca ............ tempo limite da busca, em milissegundos
;   timeout_candidatura ...... tempo limite da candidatura, em milissegundos
;   timeout_elemento ........ tempo limite de cada elemento, em milissegundos
;   espera_navegacao ........ espera da navegacao, em milissegundos
;   maximo_vagas ............ quantas vagas a busca traz no maximo
;   user_agent ............... user-agent usado nas navegacoes
;
; [candidatura]
;   seletor_arquivo .......... campo de upload do curriculo
;   seletor_termos ........... caixa de aceite dos termos
;   seletor_enviar ........... botao de envio do curriculo
;   seletor_sucesso ......... texto que confirma o envio
;   url_sucesso ............. parte da URL que indica a pagina de sucesso
;   tamanho_maximo_curriculo . tamanho maximo do curriculo, em megabytes
; ---------------------------------------------------------------------------

[bot]
timeout_busca = 60000
timeout_candidatura = 90000
timeout_elemento = 20000
espera_navegacao = 15000
maximo_vagas = 20
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36

[candidatura]
seletor_arquivo = input[type="file"]
seletor_termos = input#politica
seletor_enviar = button#enviarCV
seletor_sucesso = /sucesso
url_sucesso = /sucesso
tamanho_maximo_curriculo = 5
